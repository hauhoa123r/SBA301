# Applied last, on top of the EXISTING EC2 Compose files. No volume/mount changes.
services:
  mysql:
    image: ${MYSQL_IMAGE_REF:?MYSQL_IMAGE_REF is required}
  backend:
    image: ${BACKEND_IMAGE_REF:?BACKEND_IMAGE_REF is required}
    environment:
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${BACKEND_DDL_MODE:?BACKEND_DDL_MODE is required}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
  nginx:
    image: ${NGINX_IMAGE_REF:?NGINX_IMAGE_REF is required}
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -q --no-check-certificate --header='Host: edujar.site' --spider https://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
