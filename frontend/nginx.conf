log_format upstream_log
'$remote_addr - [$time_local] '
'"$request" '
'status=$status '
'request_time=$request_time '
'upstream_addr=$upstream_addr '
'upstream_status=$upstream_status '
'upstream_connect_time=$upstream_connect_time '
'upstream_response_time=$upstream_response_time '
'host=$host '
'xff="$http_x_forwarded_for"';

server {
    listen 80 default_server;
    server_name _;

    access_log /dev/stdout upstream_log;
    error_log /dev/stderr warn;

    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/edujar.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edujar.site/privkey.pem;

    access_log /dev/stdout upstream_log;
    error_log /dev/stderr warn;

    return 444;
}

server {
    listen 80;
    server_name edujar.site www.edujar.site;

    access_log /dev/stdout upstream_log;
    error_log /dev/stderr warn;

    return 301 https://edujar.site$request_uri;
}

server {
    listen 443 ssl;
    server_name edujar.site www.edujar.site;

    ssl_certificate /etc/letsencrypt/live/edujar.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edujar.site/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout upstream_log;
    error_log /dev/stderr warn;

    location /api/ {
        proxy_pass http://backend:8081;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    location /actuator/ {

        allow 172.18.0.0/16;
        deny all;

        proxy_pass http://backend:8081;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}