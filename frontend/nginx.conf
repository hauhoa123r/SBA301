
# =====================================
# HTTP - Redirect to HTTPS
# =====================================
server {
    listen 80 default_server;
    server_name edujar.site www.edujar.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://edujar.site$request_uri;
    }
}

# =====================================
# HTTPS - EduJar Application
# =====================================
server {
    listen 443 ssl;
    server_name edujar.site www.edujar.site;

    ssl_certificate /etc/letsencrypt/live/edujar.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edujar.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Health check
    location = /api/actuator/health {
        proxy_pass http://backend:8081/actuator/health;
        include /etc/nginx/proxy_params;
    }

    # Block other actuator endpoints
    location ^~ /api/actuator {
        return 404;
    }

    location ^~ /actuator {
        return 404;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8081;
        include /etc/nginx/proxy_params;
    }

    # Google OAuth authorization
    location /oauth2/ {
        proxy_pass http://backend:8081;
        include /etc/nginx/proxy_params;
    }

    # Google OAuth callback
    location /login/oauth2/ {
        proxy_pass http://backend:8081;
        include /etc/nginx/proxy_params;
    }

    # Missing static assets must not fall back to the SPA.
    location /assets/ {
        try_files $uri =404;
    }

    # React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
