server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/edujar.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edujar.site/privkey.pem;

    return 444;
}

server {
    listen 80;
    server_name edujar.site www.edujar.site;

    return 301 https://edujar.site$request_uri;
}

server {
    listen 443 ssl;
    server_name edujar.site www.edujar.site;

    ssl_certificate /etc/letsencrypt/live/edujar.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edujar.site/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8081;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}