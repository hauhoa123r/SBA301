
# HTTP: Let's Encrypt + HTTPS redirect
server {
    listen 80 default_server;
    server_name edujar.site www.edujar.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://edujar.site$request_uri;
    }
}

# HTTPS: EduJar
server {
    listen 443 ssl;
    server_name edujar.site www.edujar.site;

    ssl_certificate /etc/letsencrypt/live/edujar.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edujar.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/actuator/health {
        proxy_pass http://backend:8081/actuator/health;
    }

    location /api/actuator {
        return 404;
    }

    location /actuator {
        return 404;
    }

    # Spring Boot REST API
    location /api/ {
        proxy_pass http://backend:8081;
        include /etc/nginx/proxy_params;
    }

    # Start Google OAuth2 login
    location /oauth2/ {
        proxy_pass http://backend:8081;
        include /etc/nginx/proxy_params;
    }

    # Google OAuth2 callback
    location /login/oauth2/ {
        proxy_pass http://backend:8081;
        include /etc/nginx/proxy_params;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
