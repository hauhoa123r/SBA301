spring.application.name=backend

# Admin URL-only activity controls. Schedule uses Vietnam time; rules are stored in MySQL.
app.activity-lab.enabled=${ACTIVITY_LAB_ENABLED:false}
app.activity-lab.cron=${ACTIVITY_LAB_CRON:0 */15 * * * *}

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.create-payment-url=${PAYOS_CREATE_PAYMENT_URL:https://api-merchant.payos.vn/v2/payment-requests}
payos.payment-request-url=${PAYOS_PAYMENT_REQUEST_URL:https://api-merchant.payos.vn/v2/payment-requests}

app.frontend.payment-result-url=${FRONTEND_PAYMENT_RESULT_URL}
app.frontend.verify-email-url=${FRONTEND_VERIFY_EMAIL_URL}

mail.provider=${MAIL_PROVIDER:smtp}

resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:}
resend.base-url=${RESEND_BASE_URL:https://api.resend.com}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

server.forward-headers-strategy=framework

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl=${JWT_ACCESS_TTL:PT15M}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:P30D}
app.oauth2.frontend-redirect-uri=${OAUTH2_FRONTEND_REDIRECT_URI}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email


mail.from.email=${MAIL_FROM_EMAIL:${SMTP_USERNAME:}}
mail.from.name=${MAIL_FROM_NAME:Chinese Online Learning}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Secure by default; only the explicit local profile permits HTTP cookies.
app.auth.cookie-secure=true
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
server.servlet.session.cookie.secure=true
