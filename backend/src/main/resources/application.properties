spring.application.name=backend

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chinese_online_learning}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.create-payment-url=${PAYOS_CREATE_PAYMENT_URL:https://api-merchant.payos.vn/v2/payment-requests}
payos.payment-request-url=${PAYOS_PAYMENT_REQUEST_URL:https://api-merchant.payos.vn/v2/payment-requests}

app.frontend.payment-result-url=${FRONTEND_PAYMENT_RESULT_URL:http://localhost:5173/payment/result}
app.frontend.verify-email-url=${FRONTEND_VERIFY_EMAIL_URL:http://localhost:5173/verify-email}

mail.provider=${MAIL_PROVIDER:smtp}

resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:}
resend.base-url=${RESEND_BASE_URL:https://api.resend.com}

spring.mail.host=${SMTP_HOST:587}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:sonnhhe189023@fpt.edu.vn}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

server.forward-headers-strategy=framework

app.cors.allowed-origins=https://edujar.site,https://www.edujar.site,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl=${JWT_ACCESS_TTL}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL}
app.oauth2.frontend-redirect-uri=${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth/callback}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.provider=facebook
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v23.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v23.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/v23.0/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id
