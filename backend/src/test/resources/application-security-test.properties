spring.datasource.url=jdbc:h2:mem:securityaudit;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS chinese_online_learning
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=chinese_online_learning
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.jwt.access-ttl=PT15M
app.jwt.refresh-ttl=P30D
app.cors.allowed-origins=http://localhost:5173
app.oauth2.frontend-redirect-uri=http://localhost:5173/oauth/callback
app.frontend.verify-email-url=http://localhost:5173/verify-email
app.frontend.payment-result-url=http://localhost:5173/payment/result
spring.security.oauth2.client.registration.google.client-id=test-client
spring.security.oauth2.client.registration.google.client-secret=test-secret
spring.mail.username=test@example.test
mail.from.email=test@example.test
management.health.mail.enabled=false
payos.checksum-key=security-test-checksum-key
logging.level.org.hibernate.tool.schema=ERROR

app.auth.cookie-secure=false
server.servlet.session.cookie.secure=false
